<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <h1 class="app-title">UserDesk</h1>
      <p class="app-subtitle">User Management Platform</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="input-group">
        <label>User ID</label>
        <input
          class="input-field"
          formControlName="userId"
          placeholder="Enter your User ID" />
        <span class="field-error" *ngIf="loginForm.get('userId')?.hasError('required') && loginForm.get('userId')?.touched">
          User ID is required
        </span>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          class="input-field"
          type="password"
          formControlName="password"
          placeholder="Enter your password" />
        <span class="field-error" *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
          Password is required
        </span>
      </div>

      <div class="input-group">
        <label>Role</label>
        <select class="input-field" formControlName="role">
          <option value="" disabled>Select your role</option>
          <option value="General User">General User</option>
          <option value="Admin">Admin</option>
        </select>
        <span class="field-error" *ngIf="loginForm.get('role')?.hasError('required') && loginForm.get('role')?.touched">
          Role is required
        </span>
      </div>

      <div class="error-box" *ngIf="errorMessage">
        <span>⚠️ {{ errorMessage }}</span>
      </div>

      <button type="submit" class="login-btn" [disabled]="loading">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading">Please wait...</span>
      </button>

    </form>
  </div>
</div>
